<!doctype html>
<html lang="vi">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><title>3T · Sandbox độc lập</title>
  <style>
    :root {
      font-family: system-ui, sans-serif;
      color: #173d34;
      background: #f3f6f5;
      color-scheme: light;
    }
    * {
      box-sizing: border-box;
    }
    body {
      max-width: 850px;
      margin: auto;
      padding: 20px;
    }
    h1 {
      font-size: 26px;
    }
    section {
      background: white;
      border: 1px solid #dfe9e4;
      border-radius: 14px;
      padding: 20px;
      margin: 18px 0;
    }
    label {
      display: block;
      margin: 14px 0;
    }
    input,
    select,
    button {
      font: inherit;
      min-height: 44px;
      padding: 10px;
      border: 1px solid #a9bfb7;
      border-radius: 8px;
    }
    input:not([type="checkbox"]),
    select {
      width: 100%;
      margin-top: 6px;
    }
    button {
      cursor: pointer;
      background: #087f66;
      color: white;
      margin: 6px 6px 6px 0;
    }
    button:disabled {
      opacity: 0.5;
      cursor: default;
    }
    label.person {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    label.person input:last-child {
      width: 80px;
      margin-left: auto;
    }
    .money {
      font-variant-numeric: tabular-nums;
      text-align: right;
    }
    .row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid #dfe9e4;
    }
    #message {
      color: #a12820;
      white-space: pre-wrap;
    }
    small {
      display: block;
      line-height: 1.6;
      color: #526e64;
    }
    pre {
      white-space: pre-wrap;
    }
    a {
      color: #087f66;
    }
  </style>
  <h1>3T · Sandbox độc lập</h1>
  <small
    >Dữ liệu giả trong RAM · Không đăng nhập · Không Supabase/Docker · Tắt
    server sẽ mất dữ liệu. Đây là màn thử nghiệp vụ, chưa phải giao diện app
    thật.</small
  >
  <label
    >Đóng vai<select id="actor">
      <option value="a">An · Admin / người tính tiền</option>
      <option value="b">Bình · Thành viên</option>
      <option value="c">Chi · Thành viên</option>
      <option value="x">Người chưa vào nhóm</option>
    </select></label
  >
  <p id="message" role="status"></p>
  <div id="content"></div>
  <script type="module" src="/app.js"></script>
</html>
